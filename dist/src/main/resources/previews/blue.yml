# DOCUMENTATION: https://docs.artillex-studios.com/axcrates.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html

title: "%crate%"
# a gui can have 1-6 rows
rows: 6
# how many items should be shown on a single page?
page-size: 36

# ----- REWARDS -----

# the lore of rewards
reward:
  - "%lore%"
  - " "
  - "&#00CCFF&l> &#00CCFFTier &8- &#00CCFF%tier%"
  - "&#00CCFF&l> &#00CCFFChance &8- &#00CCFF%chance%%"

blacklist-editor:
  title: "&0Blacklist > %crate%"
  reward-name:
    allowed-prefix: "&#44FF44&l✔ "
    blacklisted-prefix: "&#FF4444&l✖ "
  blacklisted-item:
    enabled: true
    material: "BARRIER"
    name: "&#FF4444&lBlacklisted"
    lore:
      - "&#DDDDDDOriginal reward: &f%item%"
      - "&#DDDDDDOriginal chance: &f%chance%%%"
  reward-lore:
    allowed:
      - " "
      - "&#44FF44Status: Allowed"
      - "&#FFAA00Left Click &8- &#FF4444Blacklist this reward"
    blacklisted:
      - " "
      - "&#FF4444Status: Blacklisted"
      - "&#FFAA00Left Click &8- &#44FF44Allow this reward"
  blacklist:
    # set to "" to disable
    sound: "ui.button.click"
  unblacklist:
    # set to "" to disable
    sound: "ui.button.click"
  filler:
    slot:
      - "0-8"
      - "45-53"
    material: "BLUE_STAINED_GLASS_PANE"
    name: " "
  back:
    slot: 45
    material: "ARROW"
    name: "&#00CCFF&lBack"
    lore:
      - " "
      - "&#00CCFF&l> &#00CCFFClick &8- &#00CCFFGo Back"
    sound: "ui.button.click"
  filter-info:
    slot: 49
    material: "HOPPER"
    name: "&#00CCFF&lFilter Info"
    lore:
      - " "
      - "&#44FF44&l✔ &#DDDDDDAllowed &8- &#DDDDDDreward can be received"
      - "&#FF4444&l✖ &#DDDDDDBlacklisted &8- &#DDDDDDreward will be deleted"
      - " "
      - "&#FFAA00Left Click &8- &#DDDDDDToggle status"

# ----- ITEMS -----

filler:
  slot:
  - "0-8"
  - "45-53"
  material: "BLUE_STAINED_GLASS_PANE"
  name: " "

# this item will only show if there are at least 2 pages
previous-page:
  slot: 47
  material: "ARROW"
  name: "&#00CCFF&lPrevious Page"
  lore:
    - " "
    - "&#00CCFF&l> &#00CCFFClick &8- &#00CCFFGo to Previous Page"
  # list of sounds: https://www.digminecraft.com/lists/sound_list_pc.php
  # the sound played when clicking this item
  # set to "" to disable
  sound: "ui.button.click"

close:
  slot: 49
  material: "BLUE_CANDLE"
  name: "&#00CCFF&lClose"
  lore:
    - " "
    - "&#00CCFF&l> &#00CCFFClick &8- &#00CCFFClose Menu"
  sound: "ui.button.click"

hopper:
  slot: 48
  material: "HOPPER"
  name: "&#00CCFF&lBlacklist"
  lore:
    - " "
    - "&#00CCFF&l> &#00CCFFClick &8- &#00CCFFManage Blacklist"
  sound: "ui.button.click"

# this item will only show if there are at least 2 pages
next-page:
  slot: 51
  material: "ARROW"
  name: "&#00CCFF&lNext Page"
  lore:
    - " "
    - "&#00CCFF&l> &#00CCFFClick &8- &#00CCFFGo to Next Page"
  sound: "ui.button.click"

